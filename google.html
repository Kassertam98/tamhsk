<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập Google · Tâm HSK</title><meta name="robots" content="noindex">
<style>
:root{--paper:#faf6ee;--card:#fff;--ink:#22231f;--muted:#6b6a63;--line:#e4ddcf;--jade:#1f7a55;--seal:#c0392b}
@media (prefers-color-scheme:dark){:root{--paper:#171815;--card:#22231f;--ink:#eeeae0;--muted:#a7a49a;--line:#3a3b35}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;display:grid;gap:14px;justify-items:center;text-align:center}
h1{font-size:22px;margin:0}p{margin:0;color:var(--muted)}#gbtn{min-height:44px}
.back{display:inline-block;padding:14px 26px;border-radius:999px;background:var(--jade);color:#fff;font-weight:700;text-decoration:none;font-size:17px}
.err{color:var(--seal)}
</style></head><body>
<main class="card"><img src="icons/icon-192.png" width="72" height="72" alt="" style="border-radius:18px">
<h1>Đăng nhập Tâm HSK bằng Google</h1><p id="msg">Chọn tài khoản Google của bạn.</p><div id="gbtn"></div></main>
<script>
(function(){
  var API='https://tamhsk-api.nguyenminhtam19081998.workers.dev',msg=document.getElementById('msg'),box=document.getElementById('gbtn');
  function say(t,err){msg.textContent=t;msg.className=err?'err':'';}
  function done(code){
    var url='tamhsk://auth?code='+encodeURIComponent(code);
    box.innerHTML='<a class="back" href="'+url+'">Quay lại app Tâm HSK</a>';
    say('Đã xác nhận tài khoản. Bấm nút bên dưới để quay lại app (mã có hiệu lực 5 phút).');
    try{location.href=url;}catch(e){}
  }
  fetch(API+'/v1/config').then(function(r){return r.json();}).then(function(c){
    if(!c.googleClientId){say('Máy chủ chưa bật đăng nhập Google.',true);return;}
    var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;
    s.onerror=function(){say('Không tải được dịch vụ Google. Kiểm tra mạng rồi tải lại trang.',true);};
    s.onload=function(){
      google.accounts.id.initialize({client_id:c.googleClientId,ux_mode:'popup',callback:function(r){
        say('Đang xác nhận…');box.innerHTML='';
        fetch(API+'/v1/accounts:googleCode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:r.credential})})
          .then(function(x){return x.json().then(function(j){if(!x.ok)throw new Error((j.error&&j.error.message)||'Lỗi máy chủ');return j;});})
          .then(function(j){done(j.code);})
          .catch(function(e){say('Chưa đăng nhập được: '+e.message+'. Tải lại trang để thử lại.',true);});
      }});
      google.accounts.id.renderButton(box,{type:'standard',theme:'outline',size:'large',text:'continue_with',shape:'pill',locale:'vi'});
    };
    document.head.appendChild(s);
  }).catch(function(){say('Không kết nối được máy chủ. Kiểm tra mạng rồi tải lại trang.',true);});
})();
</script></body></html>
