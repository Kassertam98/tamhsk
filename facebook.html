<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập Facebook · Tâm HSK</title><meta name="robots" content="noindex">
<style>
:root{--paper:#faf6ee;--card:#fff;--ink:#22231f;--muted:#6b6a63;--line:#e4ddcf;--jade:#1f7a55;--seal:#c0392b;--fb:#1877F2}
@media (prefers-color-scheme:dark){:root{--paper:#171815;--card:#22231f;--ink:#eeeae0;--muted:#a7a49a;--line:#3a3b35}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;display:grid;gap:14px;justify-items:center;text-align:center}
.logos{display:flex;align-items:center;gap:10px}.logos svg{width:56px;height:56px}.logos span{font-size:22px;color:var(--muted)}
h1{font-size:22px;margin:0}p{margin:0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;border:0;background:var(--fb);color:#fff;font:inherit;font-weight:700;text-decoration:none;font-size:17px;cursor:pointer}
.btn.app{background:var(--jade)}.err{color:var(--seal)}.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--fb);animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style></head><body>
<main class="card"><div class="logos"><img src="icons/icon-192.png" width="56" height="56" alt="" style="border-radius:14px"><span>＋</span><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#1877F2"/><path fill="#fff" d="M26.6 48V30.4h5.9l.9-6.9h-6.8v-4.4c0-2 .6-3.3 3.4-3.3h3.6V9.6c-.6-.1-2.8-.3-5.3-.3-5.2 0-8.8 3.2-8.8 9v5.1h-5.9v6.9h5.9V48z"/></svg></div>
<h1>Đăng nhập Tâm HSK bằng Facebook</h1><p id="msg">Đang mở Facebook…</p><div id="box"><div class="spin"></div></div></main>
<script>
(function(){
  var API='https://tamhsk-api.nguyenminhtam19081998.workers.dev';try{var o=localStorage.getItem('tamhsk-api');if(o)API=o.replace(/\/$/,'');}catch(e){}var msg=document.getElementById('msg'),box=document.getElementById('box'),q=new URLSearchParams(location.search);
  var here=location.origin+location.pathname.replace(/\.html$/,'');
  function say(t,err){msg.textContent=t;msg.className=err?'err':'';}
  function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v);}catch(e){return null;}}
  function fail(t){say(t,true);box.innerHTML='';var b=document.createElement('a');b.className='btn';b.href=here+(ss('fbmode')==='app'?'?app=1':'');b.textContent='Thử lại';box.appendChild(b);
    if(ss('fbmode')!=='app'&&window.opener){try{window.opener.postMessage({type:'tamhsk-fb',err:t},location.origin);}catch(e){}}}
  function done(code){
    if(ss('fbmode')==='app'){var url='tamhsk://auth?code='+encodeURIComponent(code);box.innerHTML='';var a=document.createElement('a');a.className='btn app';a.href=url;a.textContent='Quay lại app Tâm HSK';box.appendChild(a);
      say('Đã xác nhận tài khoản. Bấm nút bên dưới để quay lại app (mã có hiệu lực 5 phút).');try{location.href=url;}catch(e){}return;}
    var home=here.replace(/\/facebook$/,'/')+'#settings';
    if(window.opener){try{window.opener.postMessage({type:'tamhsk-fb',code:code},location.origin);}catch(e){}}
    else{try{localStorage.setItem('hsk-fbcode',code);}catch(e){}}
    say('Đăng nhập xong! Cửa sổ này sẽ tự đóng.');box.innerHTML='';
    setTimeout(function(){try{window.close();}catch(e){}},400);
    setTimeout(function(){say('Đăng nhập xong. Quay lại tab Tâm HSK để học tiếp.');var a=document.createElement('a');a.className='btn app';a.href=home;a.textContent='Về Tâm HSK';box.appendChild(a);},1500);}
  function exchange(code,redirect){say('Đang xác nhận tài khoản…');
    fetch(API+'/v1/accounts:facebookCode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,redirect:redirect})})
      .then(function(x){return x.json().then(function(j){if(!x.ok)throw new Error((j.error&&j.error.message)||'Lỗi máy chủ');return j;});})
      .then(function(j){done(j.code);})
      .catch(function(e){var m=e.message||'';fail(/NOT_CONFIGURED/.test(m)?'Máy chủ chưa bật đăng nhập Facebook (thiếu FB_APP_ID hoặc FB_APP_SECRET).':/REDIRECT_MISMATCH/.test(m)?'Địa chỉ '+here+' chưa có trong mục “Valid OAuth Redirect URIs” của app Facebook.':/SECRET_INVALID/.test(m)?'FB_APP_SECRET trên máy chủ chưa đúng.':/APP_ID_INVALID/.test(m)?'FB_APP_ID trên máy chủ chưa đúng.':/Not Found|NOT_FOUND|404/i.test(m)?'Máy chủ chưa cập nhật bản mới (cần dán lại worker.js).':'Chưa đăng nhập được ('+m+').');});}
  if(q.get('fbtest')){ss('fbmode',q.get('app')?'app':'web');exchange('test:'+q.get('fbtest'),here);return;}
  if(q.get('error')){fail(q.get('error_reason')==='user_denied'?'Bạn đã hủy đăng nhập Facebook.':'Facebook báo lỗi: '+(q.get('error_description')||q.get('error')));return;}
  if(q.get('code')){if(!q.get('state')||q.get('state')!==ss('fbst')){fail('Phiên đăng nhập không khớp, hãy thử lại.');return;}exchange(q.get('code'),here);return;}
  ss('fbmode',q.get('app')?'app':'web');
  fetch(API+'/v1/config').then(function(r){return r.json();}).then(function(c){
    if(!c.facebookAppId){fail('Máy chủ chưa bật đăng nhập Facebook.');return;}
    var a=new Uint8Array(16);crypto.getRandomValues(a);var st=Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');ss('fbst',st);
    location.replace('https://www.facebook.com/v21.0/dialog/oauth?'+new URLSearchParams({client_id:c.facebookAppId,redirect_uri:here,state:st,response_type:'code',scope:'public_profile,email'}).toString());
  }).catch(function(){fail('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');});
})();
</script></body></html>
