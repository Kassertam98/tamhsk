<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Quản trị Tâm HSK</title>
<style>
:root{--paper:#faf6ee;--card:#fff;--ink:#22231f;--muted:#6b6a63;--line:#e4ddcf;--jade:#0d7a63;--seal:#c0392b;--amber:#c8860b;--soft:#f3efe6}
@media (prefers-color-scheme:dark){:root{--paper:#171815;--card:#22231f;--ink:#eeeae0;--muted:#a7a49a;--line:#3a3b35;--soft:#2a2b26}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1180px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
input,select,textarea,button{font:inherit}input,select,textarea{padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{padding:7px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:600}button.pri{background:var(--jade);color:#fff;border-color:var(--jade)}button.danger{color:var(--seal);border-color:var(--seal)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}.small{font-size:13px}.err{color:var(--seal)}.okc{color:var(--jade)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12.5px;color:var(--muted);font-weight:600}tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--soft);font-size:12px;margin:1px 3px 1px 0;white-space:nowrap}.tag.g{background:#e8f0fe}.tag.k{background:#fff3d6}.tag.p{background:#fff1b8}.tag.b{background:#fde2e2;color:var(--seal)}.tag.r{background:#e3f4ec;color:var(--jade)}
.scroll{overflow-x:auto}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.grid2 label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.reg{display:grid;gap:6px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card)}
.reg.new{border-left:5px solid var(--seal)}.reg.contacted{border-left:5px solid var(--amber)}.reg.placed{border-left:5px solid var(--jade)}.reg.closed{opacity:.6}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:10}.drawer>div{width:min(560px,100%);height:100%;overflow:auto;background:var(--paper);padding:16px;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:14px}.kv span{color:var(--muted)}
.act{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;background:var(--card)}
.act input,.act textarea,.act select{width:100%;min-width:0!important}.act .row{flex-wrap:nowrap}.act .row input{flex:1}
a{color:var(--jade)}
.perr{display:inline-block;padding:2px 8px;border-radius:999px;background:#fff1e0;border:1px solid #f0b56a;color:#8a4b00;font-weight:700;font-size:12px;cursor:help;white-space:nowrap}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}.chgrid figure{margin:0;padding:6px;border:1px solid #e3ddd0;border-radius:10px;text-align:center;background:repeating-conic-gradient(#f1f1f1 0 25%,#fff 0 50%) 0 0/14px 14px}.chgrid img{width:100%;height:110px;object-fit:contain}.chgrid figcaption{font-size:11.5px;background:#fffc;border-radius:6px}
.chth{width:64px;height:74px;object-fit:contain;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px;border-radius:10px}.chpos{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;padding:10px;border:1px dashed #cbbf9f;border-radius:12px}.chpos canvas{width:360px;max-width:100%;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:12px}.chsl{display:grid;grid-template-columns:110px 1fr 54px;align-items:center;gap:6px}
</style></head><body><main>
<h1>Quản trị Tâm HSK</h1>
<div class="card" id="login">
  <h2>Đăng nhập quản trị</h2>
  <div class="row"><input id="em" type="text" autocapitalize="none" placeholder="ID / Email tài khoản KasserGroup (chủ app, quản trị viên, giáo viên)" style="flex:1;min-width:220px" autocomplete="username"><input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password" style="min-width:160px"><button class="pri" id="golog">Đăng nhập</button></div>
  <div class="small muted" style="margin:8px 0 4px">Hoặc chủ web dùng mã quản trị (ADMIN_KEY):</div>
  <div class="row"><input id="key" type="password" placeholder="Mã quản trị" style="flex:1;min-width:220px"><button id="gokey">Vào bằng mã</button></div>
  <div id="lmsg" class="err small" style="margin-top:6px"></div>
</div>
<div id="box" hidden>
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="small muted" id="whoami"></span><button id="logout">Thoát</button></div>
  <div class="tabs" id="tabs"></div><div id="pane"></div>
</div>
<script>
(function(){
  var API=(localStorage.getItem('tamhsk-api')||'https://tamhsk-api.nguyenminhtam19081998.workers.dev').replace(/\/$/,'');
  var AUTH=JSON.parse(sessionStorage.getItem('adauth')||'null'),ROLE='',TAB='';
  var $=function(s,r){return (r||document).querySelector(s);},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var vnd=function(n){return Number(n||0).toLocaleString('vi-VN')+'đ';},dt=function(t){return t?new Date(t).toLocaleString('vi-VN'):'';};
  var ERR={PAYOS_NOT_CONFIGURED:'Worker chưa có khóa PayOS (PAYOS_CLIENT_ID, PAYOS_API_KEY).',PAYOS_UNREACHABLE:'Không kết nối được PayOS, thử lại sau.',ORDER_NOT_FOUND:'Không tìm thấy đơn.',TG_BAD_TOKEN:'Mã bot Telegram (TG_BOT_TOKEN) sai. Sao chép lại nguyên mã từ BotFather (dạng 123456789:AA…), không thừa dấu cách.',TG_WEBHOOK_SET:'Bot đang gắn webhook nên không đọc được tin. Dùng một bot mới tạo riêng cho cảnh báo.',TG_NO_MESSAGE:'Bot chưa nhận được tin nào. Mở Telegram, nhắn cho bot một tin (VD: /start) rồi bấm lại.',TG_NOT_CONFIGURED:'Chưa có biến bí mật TG_BOT_TOKEN cho Worker.',TG_SEND_FAILED:'Không gửi được tin Telegram. Kiểm tra lại TG_BOT_TOKEN.',ADMIN_KEY_INVALID:'Không có quyền (mã sai hoặc tài khoản chưa được cấp quyền).',ADMIN_NOT_CONFIGURED:'Máy chủ chưa đặt ADMIN_KEY.',INVALID_LOGIN_CREDENTIALS:'Email hoặc mật khẩu không đúng.',FORBIDDEN:'Vai trò của bạn không được làm thao tác này.',NO_EMAIL:'Tài khoản này chưa có email.',NO_APP_ACCOUNT:'Người này không có tài khoản app để nhận thông báo.',WEAK_PASSWORD:'Mật khẩu cần ít nhất 6 ký tự.',INVALID_CODE:'Mã voucher cần ít nhất 3 ký tự (chữ, số, - _).',INVALID_VALUE:'Giá trị giảm không hợp lệ.',USER_DISABLED:'Tài khoản đã bị khóa.'};
  var emsg=function(m){m=String(m||'');var k=(m.match(/[A-Z_]{6,}/)||[''])[0];return ERR[k]||m;};
  function hdr(){var h={'Content-Type':'application/json'};if(AUTH&&AUTH.key)h['X-Admin-Key']=AUTH.key;if(AUTH&&AUTH.id)h.Authorization='Bearer '+AUTH.id;return h;}
  function refresh(){return fetch(API+'/v1/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AUTH.rf)}).then(function(r){return r.json();}).then(function(j){if(!j.id_token)throw new Error('ADMIN_KEY_INVALID');AUTH.id=j.id_token;sessionStorage.setItem('adauth',JSON.stringify(AUTH));});}
  function req(m,p,b,again){return fetch(API+p,{method:m,headers:hdr(),body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){
    if(r.status===401&&AUTH&&AUTH.rf&&!again)return refresh().then(function(){return req(m,p,b,true);});if(!r.ok)throw new Error(emsg(j.error&&j.error.message||r.status));return j;});});}
  var WHO={};function start(){req('GET','/v1/admin/whoami').then(function(j){ROLE=j.role;WHO=j;$('#login').hidden=true;$('#box').hidden=false;
      $('#whoami').innerHTML='Đang đăng nhập: <b>'+esc(j.who)+'</b> · vai trò <b>'+({owner:'Chủ',admin:'Quản trị viên',teacher:'Giáo viên'}[j.role])+'</b>'+(j.bank?'':' · <span class="err">Chưa đặt tài khoản ngân hàng (BANK_ID, BANK_ACC)</span>');
      var T=ROLE==='teacher'?[['regs','Đăng ký lớp']]:[['users','Người dùng'],['orders','Đơn mua'],['vouchers','Voucher'],['regs','Đăng ký lớp'],['notify','Gửi thông báo'],['games','Trò chơi'],['cf','Hạn mức Cloudflare'],['sup','Hỗ trợ'],['tapps','Đơn giáo viên'],['olc','Khóa học online'],['char','Kho nhân vật'],['ext','Lớp ngoài & cọc'],['prices','Gói & giá'],['exp','Xuất dữ liệu'],['rrep','Báo cáo Phòng Tự Học'],['log','Nhật ký']];
      $('#tabs').innerHTML=T.map(function(t){return '<button data-t="'+t[0]+'">'+t[1]+'</button>';}).join('');show(TAB&&T.some(function(t){return t[0]===TAB;})?TAB:T[0][0]);})
    .catch(function(e){AUTH=null;sessionStorage.removeItem('adauth');$('#login').hidden=false;$('#box').hidden=true;$('#lmsg').textContent=e.message;});}
  $('#tabs').onclick=function(e){var b=e.target.closest('[data-t]');if(b)show(b.dataset.t);};
  function show(t){TAB=t;$$('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t);});$('#pane').innerHTML='<div class="card muted">Đang tải…</div>';({users:users,orders:orders,vouchers:vouchers,regs:regs,notify:notify,games:games,cf:cfu,rrep:rrep,sup:sup,tapps:tapps,ext:extTab,olc:olcTab,char:charTab,prices:prices,exp:exp,log:log})[t]();}
  function fail(e){$('#pane').innerHTML='<div class="card err">'+esc(e.message)+'</div>';}
  /* --- Người dùng --- */
  var UQ='';
  function users(){req('GET','/v1/admin/users?q='+encodeURIComponent(UQ)).then(function(j){
    $('#pane').innerHTML='<div class="card"><div class="row"><input id="uq" placeholder="Tìm theo email, tên, @ID hoặc mã người dùng" value="'+esc(UQ)+'" style="flex:1;min-width:220px"><button class="pri" id="ugo">Tìm</button><span class="small muted">'+j.users.length+' / '+j.total+' tài khoản</span></div></div>'+
      '<div class="card scroll"><table><tr><th>Người dùng</th><th>Loại</th><th>Từ đã học</th><th>Chuỗi</th><th>Nguyên bảo</th><th>Hoạt động gần nhất</th></tr>'+j.users.map(function(u){
        return '<tr class="click" data-uid="'+esc(u.uid)+'"><td><b>'+esc(u.name||'(chưa đặt tên)')+'</b>'+(u.handle?' <span class="small" style="color:var(--jade)">@'+esc(u.handle)+'</span>':'')+'<div class="small muted">'+esc(u.email||u.uid)+'</div></td><td>'+kindTags(u)+'</td><td>'+u.sum.words+'</td><td>'+u.sum.streak+'</td><td>'+u.sum.coins+'</td><td class="small">'+dt(u.lastSeen)+'</td></tr>';}).join('')+'</table></div>';
    $('#ugo').onclick=function(){UQ=$('#uq').value.trim();users();};$('#uq').onkeydown=function(e){if(e.key==='Enter')$('#ugo').click();};
    $$('tr[data-uid]').forEach(function(tr){tr.onclick=function(){openUser(tr.dataset.uid);};});}).catch(fail);}
  function kindTags(u){return '<span class="tag '+(u.kind==='google'?'g':u.kind==='kasser'?'k':'')+'">'+({google:'Google',kasser:'KasserGroup',anon:'Khách'}[u.kind])+'</span>'+(u.premium||(u.premium&&u.premium.study)?'<span class="tag p">⭐ Gói</span>':'')+(u.role?'<span class="tag r">'+({admin:'Quản trị',teacher:'Giáo viên'}[u.role]||u.role)+'</span>':'')+(u.banned?'<span class="tag b">Đã khóa</span>':'');}
  function openUser(uid){req('GET','/v1/admin/user?uid='+encodeURIComponent(uid)).then(function(j){var u=j.user,P=u.premium||{},pm=!!(P.study||P.plan==='life'||(P.until&&P.until>Date.now())),tp=!!(P.teacher&&P.teacher.until>Date.now());var pmTxt=pm?(P.plan==='life'||P.study?'Trọn đời'+(P.plan?'':' · Người ủng hộ đầu tiên'):(P.plan==='year'?'Năm':'Tháng')+' đến '+new Date(P.until).toLocaleDateString('vi-VN')):'Chưa có';var tpTxt=P.teacher?('đến '+new Date(P.teacher.until).toLocaleDateString('vi-VN')+(tp?'':' (hết hạn)')):'Chưa có';
    var d=document.createElement('div');d.className='drawer';d.innerHTML='<div><div class="row" style="justify-content:space-between"><h2>'+esc(j.profile.name||u.email||'Người dùng')+'</h2><button id="dx">Đóng ✕</button></div>'+
      '<div class="kv card"><span>Email</span><b>'+esc(u.email||'(không có)')+'</b><span>Loại</span><div>'+kindTags({kind:u.kind,premium:pm,role:u.role,banned:u.banned})+'</div><span>Mã người dùng</span><code class="small">'+esc(u.uid)+'</code><span>Ngày tạo</span><span>'+dt(u.created)+'</span><span>Đồng bộ gần nhất</span><span>'+dt(j.saveAt)+'</span>'+
      '<span>Tiến độ</span><b>'+j.sum.words+' từ · chuỗi '+j.sum.streak+' ngày · '+j.sum.coins+' Nguyên bảo</b><span>Ví trên máy chủ</span><div>'+(j.wallet?'<b>'+j.wallet.coins+' Nguyên bảo</b><div class="small muted">'+j.wallet.log.slice(0,8).map(function(x){return (x.delta>0?'+':'')+x.delta+' · '+esc(x.why||x.kind)+' · '+dt(x.at);}).join('<br>')+'</div>':'<span class="muted">Chưa chuyển ví (app cũ hoặc chưa đăng nhập)</span>')+'</div><span>Hồ sơ bạn bè</span><span>'+(j.profile.code?'Mã '+esc(j.profile.code)+' · cấp '+j.profile.level+' · '+j.profile.xp+' XP':'Chưa tạo')+'</span>'+
      '<span>Giải đấu</span><span>'+(j.league.map(function(l){return l.week+': hạng '+['Đồng','Bạc','Vàng','Bạch Kim','Kim Cương'][l.tier]+' '+l.xp+' XP';}).join('<br>')||'Chưa tham gia')+'</span>'+
      '<span>Đơn mua</span><span>'+(j.orders.map(function(o){return esc(o.ref)+' · '+vnd(o.final)+' · '+o.status;}).join('<br>')||'Chưa có')+'</span><span>Đăng ký lớp</span><span>'+(j.regs.map(function(r){return esc(r.want)+' · '+r.status;}).join('<br>')||'Chưa có')+'</span></div>'+
      '<div class="grid2"><div class="act"><b>⭐ Gói học: '+esc(pmTxt)+'</b><div class="row"><select id="aplan"><option value="month">+ Gói Tháng (30 ngày)</option><option value="year">+ Gói Năm (365 ngày + 300 NB)</option><option value="life">+ Trọn đời</option><option value="plus">+ Plus 1 tháng (Khỉ Thông Thái tự thu hoạch)</option><option value="plus_life">+ Plus trọn đời</option><option value="replay">+ Chơi Tiếp 1 tháng</option><option value="replay_year">+ Chơi Tiếp 1 năm</option><option value="coins1000">+ 1.000 Nguyên bảo</option></select><button data-a="plan">Tặng gói</button>'+(pm?'<button data-a="premium">Thu hồi gói học</button>':'')+'</div></div>'+
      '<div class="act"><b>🏫 Gói Giáo viên: '+esc(tpTxt)+'</b><div class="row"><button data-a="tplan">+ 30 ngày Giáo viên</button></div></div>'+
      '<div class="act"><b>'+String.fromCodePoint(0x1FA99)+' Nguyên bảo</b><div class="row"><input id="acn" type="number" placeholder="+50 / -20"><input id="acw" placeholder="Lý do"></div><button data-a="coins">Gửi</button></div>'+
      '<div class="act"><b>🔑 Mật khẩu tạm</b><input id="apw" placeholder="Ít nhất 6 ký tự"><button data-a="password"'+(u.email?'':' disabled')+'>Đặt mật khẩu</button><span class="small muted">Báo cho học viên mật khẩu mới qua điện thoại/Zalo.</span></div>'+
      '<div class="act"><b>🔔 Thông báo riêng</b><input id="ant" placeholder="Tiêu đề"><textarea id="anb" rows="2" placeholder="Nội dung"></textarea><button data-a="notify">Gửi</button></div>'+
      (ROLE==='owner'?'<div class="act"><b>👤 Phân quyền</b><select id="arole"><option value="">Người dùng thường</option><option value="teacher"'+(u.role==='teacher'?' selected':'')+'>Giáo viên (tạo lớp học, xem đăng ký lớp)</option><option value="admin"'+(u.role==='admin'?' selected':'')+'>Quản trị viên (toàn quyền trừ phân quyền)</option></select><button data-a="role"'+(u.email?'':' disabled')+'>Lưu quyền</button></div>':'')+
      '<div class="act"><b>🖼️ Ảnh, bảng xếp hạng & thông báo thế giới</b><span class="small muted">Gỡ ảnh không phù hợp, tin vinh danh sai, hoặc người gian lận điểm khỏi bảng xếp hạng.</span><button data-a="avatar" class="danger">Gỡ ảnh đại diện</button><button data-a="world" class="danger">Xóa tin thế giới của người này</button><button data-a="league" class="danger">Gỡ khỏi Giải đấu tuần này</button><button data-a="wall" class="danger">Gỡ khỏi bảng thợ xây Vạn Lý</button></div>'+
      '<div class="act"><b>⛔ Khóa / xóa</b><button data-a="ban" class="danger">'+(u.banned?'Mở khóa tài khoản':'Khóa tài khoản')+'</button><button data-a="delete" class="danger">Xóa vĩnh viễn</button></div></div><div id="amsg" class="small" style="margin-top:8px"></div></div>';
    document.body.appendChild(d);var close=function(){d.remove();};$('#dx',d).onclick=close;d.onclick=function(e){if(e.target===d)close();};
    var done=function(t){$('#amsg',d).innerHTML='<span class="okc">'+esc(t)+' ✓</span>';setTimeout(function(){close();openUser(uid);users();},700);},bad=function(e){$('#amsg',d).innerHTML='<span class="err">'+esc(e.message)+'</span>';};
    $$('[data-a]',d).forEach(function(b){b.onclick=function(){var a=b.dataset.a,body={uid:uid,action:a};
      if(a==='premium')body.on=false;if(a==='plan'){body.product=$('#aplan',d).value;}if(a==='tplan'){body.action='plan';body.product='teacher';}if(a==='coins'){body.coins=+$('#acn',d).value;body.why=$('#acw',d).value;}if(a==='password')body.password=$('#apw',d).value;if(a==='role')body.role=$('#arole',d).value||null;if(a==='ban')body.on=!u.banned;
      if(a==='delete'&&prompt('Gõ XOA để xóa vĩnh viễn tài khoản '+(u.email||uid)+' và toàn bộ dữ liệu:')!=='XOA')return;
      if(a==='notify'){if(!$('#ant',d).value.trim())return bad(new Error('Nhập tiêu đề'));return req('POST','/v1/admin/notify',{uid:uid,title:$('#ant',d).value,body:$('#anb',d).value,important:true}).then(function(){done('Đã gửi thông báo');}).catch(bad);}
      req('POST','/v1/admin/user/action',body).then(function(){done('Đã lưu');if(a==='delete')close();}).catch(bad);};});}).catch(function(e){alert(e.message);});}
  /* --- Đơn mua --- */
  var OS='pending';
  function payWebhook(){var api=API;var box='<div class="card"><h3>Thanh toán tự động</h3><p class="small muted">Địa chỉ nhận webhook (dán vào SePay hoặc PayOS):</p><div><b>SePay:</b> <code>'+esc(api)+'/v1/pay/sepay</code></div><div><b>PayOS:</b> <code>'+esc(api)+'/v1/pay/payos</code> <button id="poc">Đăng ký với PayOS</button> <span id="pom" class="small"></span></div><p class="small muted">Trạng thái: SePay '+(WHO.pay&&WHO.pay.sepay?'✓ đã cấu hình':'✗ chưa có SEPAY_API_KEY')+' · PayOS '+(WHO.pay&&WHO.pay.payos?'✓ đã cấu hình':'✗ chưa có PAYOS_*')+'</p></div>';return box;}

  /* 5.77: trạng thái lỗi PayOS + nhật ký thanh toán */

          var i=items[k];return (i.isWebp&&i.file.size<480000?charB64(i.file).then(function(d){return {data:d,mime:'image/webp'};}):charFileToWebp(i.file)).then(function(x){return req('POST','/v1/admin/char/img',{slug:sl,key:i.key,mime:x.mime,data:x.data});}).then(function(){done++;m.textContent='Đang tải '+done+'/'+items.length+'…';return next(k+1);});};

  function stretch(pw,em){if(!(window.crypto&&crypto.subtle))return Promise.resolve('');var te=new TextEncoder();return crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:te.encode(em),iterations:600000},k,256);}).then(function(b){var s='';new Uint8Array(b).forEach(function(x){s+=String.fromCharCode(x);});return btoa(s);});}
  $('#golog').onclick=function(){$('#lmsg').textContent='Đang đăng nhập…';var em=$('#em').value.trim(),pw=$('#pw').value;fetch(API+'/v1/accounts:prelogin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:em})}).then(function(r){return r.json();}).then(function(j){return stretch(pw,j.s||('tamhsk-pw-v2|'+em.toLowerCase()));}).catch(function(){return '';}).then(function(ck){return fetch(API+'/v1/accounts:signInWithPassword',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:em,password:pw,ck:ck||undefined,returnSecureToken:true})});}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(emsg(j.error&&j.error.message));return j;});})
    .then(function(j){AUTH={id:j.idToken,rf:j.refreshToken};sessionStorage.setItem('adauth',JSON.stringify(AUTH));start();}).catch(function(e){$('#lmsg').textContent=e.message;});};
  $('#pw').onkeydown=function(e){if(e.key==='Enter')$('#golog').click();};
  $('#logout').onclick=function(){AUTH=null;sessionStorage.removeItem('adauth');location.reload();};
  if(AUTH)start();
